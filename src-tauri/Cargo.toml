[package]
name = "rm-bin"
version = "0.1.3"
description = "Drop images onto the bin, they appear on your reMarkable"
authors = ["Zoe"]
edition = "2021"

[lib]
name = "rm_bin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3.2"
window-vibrancy = "0.8.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
