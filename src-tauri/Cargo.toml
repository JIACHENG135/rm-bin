[package]
name = "rm-bin"
version = "0.3.0"
description = "Drop images onto the bin, they appear on your reMarkable"
authors = ["Zoe"]
edition = "2021"
# `src/bin/` now holds several debug tools alongside the real app (draw_markdown,
# compare_cjk_font, ...) — without this, a bare `cargo run` (what `tauri dev`
# invokes) can't tell which one to run and refuses outright.
default-run = "rm-bin"

[lib]
name = "rm_bin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
pulldown-cmark = { version = "0.13.4", default-features = false }
ab_glyph = "0.2.32"
vtracer = "0.6.5"
visioncortex = "0.8.10"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3.2"
window-vibrancy = "0.8.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[dev-dependencies]
remarkable_lines = "0.1.3"
